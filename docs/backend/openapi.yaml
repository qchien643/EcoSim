openapi: 3.1.1
info:
  title: ecoSim Backend MVP
  version: 1.0.0-design
  description: >
    Contract API của backend MVP; kiểm chứng offline bằng backend.api.self_check.
    Doanh nghiệp/brand là context scenario, không phải tenant.
    Chỉ dùng local/nội bộ tin cậy; chưa chứng nhận tải hoặc provider live.
servers:
  - url: /api/v1
security: []
paths:
  /industries:
    get:
      operationId: listIndustries
      responses:
        '200':
          description: Bundle ngành đã đăng ký; disabled không cho freeze.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Industry'}}
        default: {$ref: '#/components/responses/Error'}
  /industries/{industry_id}/profiles/{profile_version}:
    parameters:
      - {$ref: '#/components/parameters/IndustryId'}
      - {$ref: '#/components/parameters/ProfileVersion'}
    get:
      operationId: getIndustryBundle
      responses:
        '200':
          description: Schema persona, registry tag, mapping, policy; mô tả dùng cho từ điển.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bundle'}
        default: {$ref: '#/components/responses/Error'}
  /datasets:
    get:
      operationId: listDatasets
      responses:
        '200':
          description: Metadata công khai, không có filesystem path.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Dataset'}}
        default: {$ref: '#/components/responses/Error'}
  /cohorts:
    get:
      operationId: listCohorts
      parameters:
        - {name: industry_id, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Cohort đã chuẩn bị, sắp cohort_id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Cohort'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
  /cohorts/{cohort_id}/members:
    parameters:
      - {name: cohort_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: listCohortMembers
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Reduced persona và nguồn từng trường; sắp cohort_persona_id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Persona'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
  /scenario-templates:
    get:
      operationId: listScenarioTemplates
      description: Mẫu JSON đi kèm dự án; đọc không cần nạp cohort, không gọi model.
      responses:
        '200':
          description: Danh sách mẫu hư cấu cho kiểm thử.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ScenarioTemplateSummary'}
        default: {$ref: '#/components/responses/Error'}
  /scenario-templates/{template_id}:
    parameters:
      - {name: template_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getScenarioTemplate
      responses:
        '200':
          description: Nội dung đầy đủ của mẫu, không có dữ liệu persona thô.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScenarioTemplate'}
        default: {$ref: '#/components/responses/Error'}
  /scenario-templates/{template_id}/instantiate:
    parameters:
      - {name: template_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    post:
      operationId: instantiateScenarioTemplate
      description: >
        Tạo campaign và scenario draft trong một transaction, đổi IDs nội bộ và references,
        validate cả cohort/profile. Không freeze hoặc tạo run. Lỗi rollback toàn bộ.
        Cùng key/payload trả lại cùng IDs; cùng key khác payload trả 409.
        Cần bootstrap dữ liệu ngành/cohort trước; thiếu dữ liệu trả 422.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TemplateInstantiationInput'}
      responses:
        '201':
          description: IDs của campaign và scenario draft; retry giữ nguyên IDs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplateInstantiationResult'}
        default: {$ref: '#/components/responses/Error'}
  /campaigns:
    get:
      operationId: listCampaigns
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Campaigns theo created_at rồi campaign_id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Campaign'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignInput'}
      responses:
        '201': {$ref: '#/components/responses/Campaign'}
        default: {$ref: '#/components/responses/Error'}
  /campaigns/{campaign_id}:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    get:
      operationId: getCampaign
      responses:
        '200': {$ref: '#/components/responses/Campaign'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: updateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, campaign]
              properties:
                expected_revision: {$ref: '#/components/schemas/Revision'}
                campaign: {$ref: '#/components/schemas/CampaignInput'}
      responses:
        '200': {$ref: '#/components/responses/Campaign'}
        default: {$ref: '#/components/responses/Error'}
  /campaigns/{campaign_id}/scenarios:
    parameters:
      - {$ref: '#/components/parameters/CampaignId'}
    get:
      operationId: listScenarios
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Scenarios của campaign theo scenario_id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Scenario'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScenarioSetup'}
      responses:
        '201': {$ref: '#/components/responses/Scenario'}
        default: {$ref: '#/components/responses/Error'}
  /scenarios/{scenario_id}:
    parameters:
      - {$ref: '#/components/parameters/ScenarioId'}
    get:
      operationId: getScenario
      responses:
        '200': {$ref: '#/components/responses/Scenario'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: replaceScenarioSetup
      description: Chỉ draft; thay toàn bộ setup. Revision sai hoặc ready trả 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, setup]
              properties:
                expected_revision: {$ref: '#/components/schemas/Revision'}
                setup: {$ref: '#/components/schemas/ScenarioSetup'}
      responses:
        '200': {$ref: '#/components/responses/Scenario'}
        default: {$ref: '#/components/responses/Error'}
  /scenarios/{scenario_id}/validate:
    parameters:
      - {$ref: '#/components/parameters/ScenarioId'}
    post:
      operationId: validateScenario
      description: Không gọi model, không đổi revision.
      requestBody: {$ref: '#/components/requestBodies/Revision'}
      responses:
        '200':
          description: Preview lỗi và nhóm thực gán; valid=false vẫn là 200.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationReport'}
        default: {$ref: '#/components/responses/Error'}
  /scenarios/{scenario_id}/participants:
    parameters:
      - {$ref: '#/components/parameters/ScenarioId'}
    get:
      operationId: previewParticipants
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Preview deterministic gắn revision; config chưa đủ trả 422.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [scenario_revision, items, next_cursor]
                properties:
                  scenario_revision: {$ref: '#/components/schemas/Revision'}
                  items: {type: array, items: {$ref: '#/components/schemas/Participant'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
  /scenarios/{scenario_id}/freeze:
    parameters:
      - {$ref: '#/components/parameters/ScenarioId'}
    post:
      operationId: freezeScenario
      description: Validate lại, khóa snapshot + persona + cơ cấu; chưa gọi model.
      requestBody: {$ref: '#/components/requestBodies/Revision'}
      responses:
        '200': {$ref: '#/components/responses/Scenario'}
        default: {$ref: '#/components/responses/Error'}
  /scenarios/{scenario_id}/runs:
    parameters:
      - {$ref: '#/components/parameters/ScenarioId'}
    get:
      operationId: listRuns
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Runs theo created_at rồi run_id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Run'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createRun
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, execution]
              properties:
                expected_revision: {$ref: '#/components/schemas/Revision'}
                execution: {$ref: '#/components/schemas/Execution'}
      responses:
        '201':
          description: Run ready đã materialize nguyên khối, chưa gọi model.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRun
      responses:
        '200': {$ref: '#/components/responses/Run'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/configuration:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: exportRunConfiguration
      description: |
        Tải JSON UTF-8 từ input snapshot bất biến của run, ở mọi trạng thái.
        Không đọc cấu hình scenario hiện hành hoặc biến môi trường, không gọi model.
        Không bao gồm lịch sử, metrics hay thông tin xác thực. Đây là bản xuất,
        không phải request nhập persona hoặc tạo scenario trực tiếp.
      responses:
        '200':
          description: File cấu hình gồm persona đã chọn và bundle đã chốt.
          headers:
            Content-Disposition:
              schema: {type: string}
              description: attachment; filename="ecosim-run-configuration.json"
            Cache-Control:
              schema: {type: string, const: no-store}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunConfigurationExport'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/start:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: startRun
      description: Chỉ ready; cấu hình provider lấy từ server và khóa metadata.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Run'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/resume:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: resumeRun
      description: Chỉ failed; giữ snapshot/config, tăng epoch, có thể gọi API trả phí lại.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202': {$ref: '#/components/responses/Run'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/sessions:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: listRunSessions
      responses:
        '200':
          description: Toàn bộ phiên 1..N, lịch đã khóa và tiến độ.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/RunSession'}}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/objects:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRunObjects
      responses:
        '200':
          description: Catalog/post/doanh nghiệp snapshot cho giao diện, không phải prompt agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunObjects'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/agents:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: listRunAgents
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
      responses:
        '200':
          description: Snapshot persona và quan hệ ban đầu, thứ tự ordinal.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Participant'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/agents/{agent_id}/history:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
      - {name: agent_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    get:
      operationId: getAgentHistory
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/After'}
        - {name: session_no, in: query, schema: {type: integer, minimum: 1}}
        - {name: object_type, in: query, schema: {type: string, enum: [article, product]}}
        - {name: object_id, in: query, schema: {$ref: '#/components/schemas/Id'}}
        - {name: stage, in: query, schema: {$ref: '#/components/schemas/Stage'}}
        - {name: include_all_scores, in: query, schema: {type: boolean, default: false}}
      responses:
        '200':
          description: Ordered committed events theo session rồi sequence_no, kể cả phiên đang chạy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HistoryPage'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/progress:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRunProgress
      responses:
        '200':
          description: Counter, status, watermark/cursor trong cùng read snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Progress'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/updates:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: pollRunUpdates
      parameters:
        - {$ref: '#/components/parameters/After'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Cùng contract SSE, terminal ưu tiên; không dùng thay full history.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/StreamMessage'}}
                  next_cursor: {$ref: '#/components/schemas/NullableCursor'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/stream:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: streamRunProgress
      parameters:
        - {$ref: '#/components/parameters/After'}
        - name: Last-Event-ID
          in: header
          description: Ưu tiên hơn query after khi reconnect.
          schema: {type: string, minLength: 1, maxLength: 512}
      responses:
        '200':
          description: SSE frames, data JSON theo StreamMessage; heartbeat là comment không ID.
          content:
            text/event-stream:
              schema: {type: string}
              example: |
                id: cursor_example
                event: run_completed
                data: {"type":"run_completed","run_id":"run_example","cursor":"cursor_example","execution_epoch":1,"status":"completed","events":[],"session_no":1,"metrics_ready":true,"resync_required":true,"failure_code":null,"report_ready":true,"latest_completed_session_no":1}

        '204':
          description: Run terminal, client đã có terminal cursor; không reconnect.
        default: {$ref: '#/components/responses/Error'}
      x-message-schema: {$ref: '#/components/schemas/StreamMessage'}
  /runs/{run_id}/metric-definitions:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getMetricDefinitions
      responses:
        '200':
          description: Tên hiển thị tiếng Việt, đơn vị, scope và định nghĩa đóng băng theo run.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MetricDefinition'}}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/metrics:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getMetricSeries
      parameters:
        - {name: scope_type, in: query, required: true, schema: {type: string, enum: [run, article, shop, product]}}
        - {name: scope_id, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
        - {name: metric_name, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 200}}
      responses:
        '200':
          description: Các phiên completed theo session_no; metric/scope không áp dụng trả 422.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/MetricPoint'}}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/report:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRunReport
      responses:
        '200':
          description: Báo cáo các phiên completed; failed/running có partial=true.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{run_id}/events:
    parameters:
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRecentRunEvents
      parameters:
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Một số diễn biến gần nhất để khôi phục màn hình Diễn biến khi quay lại lần chạy.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 200
                    items: {$ref: '#/components/schemas/Event'}
        default: {$ref: '#/components/responses/Error'}
components:
  parameters:
    IndustryId: {name: industry_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ProfileVersion: {name: profile_version, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    CampaignId: {name: campaign_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ScenarioId: {name: scenario_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    RunId: {name: run_id, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    After: {name: after, in: query, schema: {type: string, minLength: 1, maxLength: 512}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
  requestBodies:
    Revision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_revision]
            properties:
              expected_revision: {$ref: '#/components/schemas/Revision'}
  responses:
    Error:
      description: 400 query/cursor; 404 missing; 409 conflict/busy; 422 invalid; 503 unavailable.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message, fields, retryable]
                properties:
                  code: {type: string}
                  message: {type: string}
                  fields: {type: array, items: {$ref: '#/components/schemas/Issue'}}
                  retryable: {type: boolean}
    Campaign:
      description: Campaign brief.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Campaign'}
    Scenario:
      description: Scenario setup và revision.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Scenario'}
    Run:
      description: Run status và cấu hình thực thi đã khóa.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Run'}
  schemas:
    Id: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$'}
    Text: {type: string, minLength: 1, maxLength: 20000}
    Revision: {type: integer, minimum: 1}
    NullableCursor: {type: [string, 'null']}
    Stage: {type: string, enum: [A1, A1R, A2, A3, A4, A5, B1, B1R, B2, B3]}
    RunStatus: {type: string, enum: [ready, running, completed, failed]}
    JsonDefinition:
      type: object
      description: Nội dung JSON có version/hash do server quản trị; không nhận tùy ý từ marketer.
      additionalProperties: true
    Industry:
      type: object
      additionalProperties: false
      required: [industry_id, profile_version, name, status, bundle_hash]
      properties:
        industry_id: {$ref: '#/components/schemas/Id'}
        profile_version: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/Text'}
        status: {enum: [ready, disabled]}
        bundle_hash: {type: string}
    Bundle:
      type: object
      additionalProperties: false
      required: [industry, persona_schema, tag_registry, persona_mapping, object_schemas, context_contract, policy]
      properties:
        industry: {$ref: '#/components/schemas/Industry'}
        persona_schema: {$ref: '#/components/schemas/JsonDefinition'}
        tag_registry: {$ref: '#/components/schemas/JsonDefinition'}
        persona_mapping: {$ref: '#/components/schemas/JsonDefinition'}
        object_schemas: {$ref: '#/components/schemas/JsonDefinition'}
        context_contract: {$ref: '#/components/schemas/JsonDefinition'}
        policy: {$ref: '#/components/schemas/JsonDefinition'}
    Dataset:
      type: object
      additionalProperties: false
      required: [dataset_id, name, revision, schema_hash, usage_notice, status]
      properties:
        dataset_id: {$ref: '#/components/schemas/Id'}
        name: {type: string}
        revision: {type: string}
        schema_hash: {type: string}
        usage_notice: {type: string}
        status: {enum: [importing, ready, failed, disabled]}
    Cohort:
      type: object
      additionalProperties: false
      required: [cohort_id, dataset_id, industry_id, profile_version, size, content_hash, status]
      properties:
        cohort_id: {$ref: '#/components/schemas/Id'}
        dataset_id: {$ref: '#/components/schemas/Id'}
        industry_id: {$ref: '#/components/schemas/Id'}
        profile_version: {$ref: '#/components/schemas/Id'}
        size: {type: integer, minimum: 1}
        content_hash: {type: string}
        status: {enum: [importing, ready, failed, disabled]}
    Persona:
      type: object
      additionalProperties: false
      required: [cohort_id, cohort_persona_id, source_persona_id, persona, provenance, field_provenance]
      properties:
        cohort_id: {$ref: '#/components/schemas/Id'}
        cohort_persona_id: {$ref: '#/components/schemas/Id'}
        source_persona_id: {type: string}
        persona:
          type: object
          description: Field IDs và enums được kiểm tra thêm bằng industry persona schema.
          additionalProperties: {type: string}
        provenance: {$ref: '#/components/schemas/JsonDefinition'}
        field_provenance:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [status]
            properties:
              status: {enum: [observed, derived, imputed_prior]}
              policy_id: {type: string}
              rule_id: {type: string}
              seed: {type: integer, minimum: 0}
              source_fields: {type: array, items: {type: string}}
    ScenarioTemplateSummary:
      type: object
      additionalProperties: false
      required: [template_id, name, description, industry_id, agent_count, session_count, shop_count, post_count, product_count]
      properties:
        template_id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/Text'}
        description: {$ref: '#/components/schemas/Text'}
        industry_id: {$ref: '#/components/schemas/Id'}
        agent_count: {type: integer, minimum: 1}
        session_count: {type: integer, minimum: 1}
        shop_count: {type: integer, minimum: 1}
        post_count: {type: integer, minimum: 0}
        product_count: {type: integer, minimum: 0}
    ScenarioTemplate:
      type: object
      additionalProperties: false
      required: [template_id, name, description, campaign, setup]
      properties:
        template_id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/Text'}
        description: {$ref: '#/components/schemas/Text'}
        campaign: {$ref: '#/components/schemas/CampaignInput'}
        setup: {$ref: '#/components/schemas/ScenarioSetup'}
    TemplateInstantiationInput:
      type: object
      additionalProperties: false
      required: [campaign, scenario_name]
      properties:
        campaign: {$ref: '#/components/schemas/CampaignInput'}
        scenario_name: {$ref: '#/components/schemas/Text'}
    TemplateInstantiationResult:
      type: object
      additionalProperties: false
      required: [campaign_id, scenario_id]
      properties:
        campaign_id: {$ref: '#/components/schemas/Id'}
        scenario_id: {$ref: '#/components/schemas/Id'}
    CampaignInput:
      type: object
      additionalProperties: false
      required: [name, brief]
      properties:
        name: {$ref: '#/components/schemas/Text'}
        brief: {$ref: '#/components/schemas/Text'}
        internal_notes: {type: string, maxLength: 20000, default: ''}
    Campaign:
      type: object
      additionalProperties: false
      required: [campaign_id, revision, campaign]
      properties:
        campaign_id: {$ref: '#/components/schemas/Id'}
        revision: {$ref: '#/components/schemas/Revision'}
        campaign: {$ref: '#/components/schemas/CampaignInput'}
    BusinessContext:
      type: object
      additionalProperties: false
      description: Tham số mô phỏng cục bộ scenario, không phải danh tính tài khoản.
      required: [organization_id, organization_name, organization_description, brand_id, brand_name, brand_description, tags]
      properties:
        organization_id: {$ref: '#/components/schemas/Id'}
        organization_name: {$ref: '#/components/schemas/Text'}
        organization_description: {$ref: '#/components/schemas/Text'}
        brand_id: {$ref: '#/components/schemas/Id'}
        brand_name: {$ref: '#/components/schemas/Text'}
        brand_description: {$ref: '#/components/schemas/Text'}
        tags:
          type: array
          description: Enterprise-family tags; source_ref chỉ organization/brand public fields cùng scenario.
          items: {$ref: '#/components/schemas/TagAssignment'}
    TagAssignment:
      type: object
      additionalProperties: false
      required: [tag_id, source_ref, visible_stages]
      properties:
        tag_id: {type: string, minLength: 1}
        source_ref:
          type: string
          minLength: 1
          description: owner_type:owner_id:field; phải thuộc public field thật của object.
        visible_stages: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Stage'}}
    Shop:
      type: object
      additionalProperties: false
      required: [shop_id, name, public_profile, tags]
      properties:
        shop_id: {$ref: '#/components/schemas/Id'}
        name: {$ref: '#/components/schemas/Text'}
        public_profile: {$ref: '#/components/schemas/Text'}
        tags: {type: array, items: {$ref: '#/components/schemas/TagAssignment'}}
        industry_data: {$ref: '#/components/schemas/IndustryData'}
    IndustryData:
      type: object
      description: Chỉ chấp nhận keys/types được object schema của bundle cho phép.
      additionalProperties: true
    Post:
      type: object
      additionalProperties: false
      required: [post_id, shop_id, title, preview, article_content, tags]
      properties:
        post_id: {$ref: '#/components/schemas/Id'}
        shop_id: {$ref: '#/components/schemas/Id'}
        title: {$ref: '#/components/schemas/Text'}
        preview: {$ref: '#/components/schemas/Text'}
        article_content: {$ref: '#/components/schemas/Text'}
        tags: {type: array, items: {$ref: '#/components/schemas/TagAssignment'}}
        industry_data: {$ref: '#/components/schemas/IndustryData'}
    Product:
      type: object
      additionalProperties: false
      required: [product_id, shop_id, position, product_name, listed_price, product_description, tags]
      properties:
        product_id: {$ref: '#/components/schemas/Id'}
        shop_id: {$ref: '#/components/schemas/Id'}
        position: {type: integer, minimum: 1}
        product_name: {$ref: '#/components/schemas/Text'}
        listed_price: {$ref: '#/components/schemas/Text'}
        product_description: {$ref: '#/components/schemas/Text'}
        tags: {type: array, items: {$ref: '#/components/schemas/TagAssignment'}}
        industry_data: {$ref: '#/components/schemas/IndustryData'}
    ScheduledPost:
      type: object
      additionalProperties: false
      required: [post_id, position]
      properties:
        post_id: {$ref: '#/components/schemas/Id'}
        position: {type: integer, minimum: 1}
    SessionSetup:
      type: object
      additionalProperties: false
      required: [session_no, posts]
      properties:
        session_no: {type: integer, minimum: 1, maximum: 20}
        posts: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ScheduledPost'}}
        active_agent_ids:
          type: array
          uniqueItems: true
          description: Omit = tất cả; mảng rỗng = không ai hoạt động. IDs từ participants preview.
          items: {$ref: '#/components/schemas/Id'}
    Relationship:
      type: object
      additionalProperties: false
      required: [awareness, familiarity, attitude, purchase_history]
      properties:
        awareness: {enum: [unknown, aware]}
        familiarity: {enum: [none, low, established]}
        attitude: {enum: [not_formed, positive, neutral, negative]}
        purchase_history: {enum: [none, has_purchased]}
      description: Validator kiểm tra compatibility; unknown không được có từng mua hoặc thái độ đã hình thành.
    RelationshipGroup:
      type: object
      additionalProperties: false
      required: [group_id, state]
      properties:
        group_id: {$ref: '#/components/schemas/Id'}
        state: {$ref: '#/components/schemas/Relationship'}
        count: {type: integer, minimum: 0}
        percentage: {type: number, minimum: 0, maximum: 100}
      oneOf:
        - required: [count]
          not: {required: [percentage]}
        - required: [percentage]
          not: {required: [count]}
    ScenarioSetup:
      type: object
      additionalProperties: false
      required: [name]
      description: >
        Draft được thiếu phần. Freeze bắt buộc industry/profile/cohort/agent_count/seeds,
        business, ít nhất một shop, posts/products/sessions/groups/policy.
        Không nhận runtime fields, secrets hoặc filesystem paths.
      properties:
        name: {$ref: '#/components/schemas/Text'}
        industry_id: {$ref: '#/components/schemas/Id'}
        profile_version: {$ref: '#/components/schemas/Id'}
        cohort_id: {$ref: '#/components/schemas/Id'}
        agent_count: {type: integer, minimum: 1, maximum: 100}
        selection_seed: {type: integer, minimum: 0}
        assignment_seed: {type: integer, minimum: 0}
        policy_version: {$ref: '#/components/schemas/Id'}
        business: {$ref: '#/components/schemas/BusinessContext'}
        shops: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/Shop'}}
        posts: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Post'}}
        products: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/Product'}}
        sessions: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/SessionSetup'}}
        relationship_groups: {type: array, minItems: 1, items: {$ref: '#/components/schemas/RelationshipGroup'}}
    Scenario:
      type: object
      additionalProperties: false
      required: [scenario_id, campaign_id, revision, status, snapshot_hash, setup]
      properties:
        scenario_id: {$ref: '#/components/schemas/Id'}
        campaign_id: {$ref: '#/components/schemas/Id'}
        revision: {$ref: '#/components/schemas/Revision'}
        status: {enum: [draft, ready]}
        snapshot_hash: {type: [string, 'null']}
        setup: {$ref: '#/components/schemas/ScenarioSetup'}
    Issue:
      type: object
      additionalProperties: false
      required: [path, code, message, severity]
      properties:
        path: {type: string}
        code: {type: string}
        message: {type: string}
        severity: {enum: [error, warning]}
    GroupCount:
      type: object
      additionalProperties: false
      required: [group_id, requested_count, requested_percentage, assigned_count, assigned_percentage]
      properties:
        group_id: {$ref: '#/components/schemas/Id'}
        requested_count: {type: [integer, 'null'], minimum: 0}
        requested_percentage: {type: [number, 'null'], minimum: 0, maximum: 100}
        assigned_count: {type: integer, minimum: 0}
        assigned_percentage: {type: number, minimum: 0, maximum: 100}
    ValidationReport:
      type: object
      additionalProperties: false
      required: [valid, revision, issues, group_counts]
      properties:
        valid: {type: boolean}
        revision: {$ref: '#/components/schemas/Revision'}
        issues: {type: array, items: {$ref: '#/components/schemas/Issue'}}
        group_counts: {type: array, items: {$ref: '#/components/schemas/GroupCount'}}
    Participant:
      type: object
      additionalProperties: false
      required: [agent_id, ordinal, persona, group_id, initial_relationship]
      properties:
        agent_id: {$ref: '#/components/schemas/Id'}
        ordinal: {type: integer, minimum: 1}
        persona: {$ref: '#/components/schemas/Persona'}
        group_id: {$ref: '#/components/schemas/Id'}
        initial_relationship: {$ref: '#/components/schemas/Relationship'}
    Execution:
      type: object
      additionalProperties: false
      required: [mode, batch_size]
      properties:
        mode: {enum: [sequential, parallel]}
        batch_size: {type: integer, minimum: 1, maximum: 8}
      allOf:
        - if: {properties: {mode: {const: sequential}}, required: [mode]}
          then: {properties: {batch_size: {const: 1}}}
    Run:
      type: object
      additionalProperties: false
      required: [run_id, scenario_id, scenario_revision, snapshot_hash, status, execution_epoch, execution, failure_code, started_at, ended_at]
      properties:
        run_id: {$ref: '#/components/schemas/Id'}
        scenario_id: {$ref: '#/components/schemas/Id'}
        scenario_revision: {$ref: '#/components/schemas/Revision'}
        snapshot_hash: {type: string}
        status: {$ref: '#/components/schemas/RunStatus'}
        execution_epoch: {type: integer, minimum: 0}
        execution: {$ref: '#/components/schemas/Execution'}
        failure_code: {type: [string, 'null']}
        started_at: {type: [string, 'null'], format: date-time}
        ended_at: {type: [string, 'null'], format: date-time}
    RunConfigurationExport:
      type: object
      additionalProperties: false
      required: [format_version, snapshot_hash, input_snapshot]
      properties:
        format_version: {type: string, const: ecosim-run-configuration-v1}
        snapshot_hash:
          type: string
          description: Hash của frozen scenario snapshot, không phải hash toàn bộ file export.
        input_snapshot:
          type: object
          additionalProperties: false
          required: [schema, run_id, scenario_id, campaign_id, scenario_revision, campaign, setup, bundle, execution]
          properties:
            schema: {type: string, const: scenario-snapshot-v1}
            run_id: {$ref: '#/components/schemas/Id'}
            scenario_id: {$ref: '#/components/schemas/Id'}
            campaign_id: {$ref: '#/components/schemas/Id'}
            scenario_revision: {$ref: '#/components/schemas/Revision'}
            campaign:
              type: object
              description: Bản sao campaign tại thời điểm freeze, gồm brief và ghi chú.
            setup:
              type: object
              description: |
                Cấu hình đã materialize: doanh nghiệp, shop, sản phẩm, bài viết,
                lịch đăng, seeds, cơ cấu và selected_members chứa persona/provenance.
                Không phải ScenarioSetup đầu vào; không dùng để upload persona.
            bundle:
              type: object
              description: Bản sao profile, schema persona, mapping, tags, renderer và policy.
            execution: {$ref: '#/components/schemas/Execution'}
    RunSession:
      type: object
      additionalProperties: false
      required: [session_no, status, active_agents, completed_agents, posts]
      properties:
        session_no: {type: integer, minimum: 1}
        status: {enum: [pending, running, completed, failed]}
        active_agents: {type: integer, minimum: 0}
        completed_agents: {type: integer, minimum: 0}
        posts: {type: array, items: {$ref: '#/components/schemas/ScheduledPost'}}
    RunObjects:
      type: object
      additionalProperties: false
      required: [business, shops, posts, products]
      properties:
        business: {$ref: '#/components/schemas/BusinessContext'}
        shops: {type: array, items: {$ref: '#/components/schemas/Shop'}}
        posts: {type: array, items: {$ref: '#/components/schemas/Post'}}
        products: {type: array, items: {$ref: '#/components/schemas/Product'}}
    ScoredTag:
      type: object
      additionalProperties: false
      required: [tag_id, score, selected, rank, description]
      properties:
        tag_id: {type: string}
        score: {type: number, minimum: 0, maximum: 1}
        selected: {type: boolean}
        rank: {type: integer, minimum: 1}
        description: {type: string, minLength: 1}
    Event:
      type: object
      additionalProperties: false
      required: [event_id, session_no, session_status, agent_id, object_type, object_id, encounter_no, stage, sequence_no, status, action, score, parent_event_id, source, tags]
      properties:
        event_id: {$ref: '#/components/schemas/Id'}
        session_no: {type: integer, minimum: 1}
        session_status: {enum: [pending, running, completed, failed]}
        agent_id: {$ref: '#/components/schemas/Id'}
        object_type: {enum: [article, product]}
        object_id: {$ref: '#/components/schemas/Id'}
        encounter_no: {type: integer, minimum: 1}
        stage: {$ref: '#/components/schemas/Stage'}
        sequence_no: {type: integer, minimum: 1}
        status: {enum: [resolved, empty_result, unresolved]}
        action:
          enum: [null, attend, attend_again, skip, like, dislike, no_reaction, keep_current, remove_reaction, no_new_reaction, visit, not_visit, visit_again, not_visit_again, buy, not_buy, buy_again, not_buy_again]
        score: {type: [number, 'null'], minimum: 0, maximum: 1}
        parent_event_id: {type: [string, 'null']}
        source: {enum: [null, jev, llm_fallback]}
        tags: {type: array, items: {$ref: '#/components/schemas/ScoredTag'}}
      allOf:
        - if: {properties: {status: {enum: [empty_result, unresolved]}}, required: [status]}
          then: {properties: {action: {type: 'null'}}}
    HistoryPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Event'}}
        next_cursor: {$ref: '#/components/schemas/NullableCursor'}
    LiveCounters:
      type: object
      additionalProperties: false
      required: [scope_type, scope_id, values]
      properties:
        scope_type: {enum: [run, article, shop, product]}
        scope_id: {$ref: '#/components/schemas/Id'}
        values:
          type: object
          description: Tên từ metric definitions; counts lũy kế và current reaction, không rates.
          additionalProperties: {type: integer, minimum: 0}
    Progress:
      type: object
      additionalProperties: false
      required: [run_id, status, execution_epoch, cursor, session_no, latest_completed_session_no, active_agents, completed_agents, provisional, counters]
      properties:
        run_id: {$ref: '#/components/schemas/Id'}
        status: {$ref: '#/components/schemas/RunStatus'}
        execution_epoch: {type: integer, minimum: 0}
        cursor: {type: string}
        session_no: {type: [integer, 'null'], minimum: 1}
        latest_completed_session_no: {type: [integer, 'null'], minimum: 1}
        active_agents: {type: integer, minimum: 0}
        completed_agents: {type: integer, minimum: 0}
        provisional: {type: boolean}
        counters: {type: array, items: {$ref: '#/components/schemas/LiveCounters'}}
    StreamMessage:
      type: object
      additionalProperties: false
      required: [type, run_id, cursor, execution_epoch, status, events, session_no, metrics_ready, resync_required, failure_code]
      properties:
        type: {enum: [run_started, progress_batch, session_completed, run_completed, run_failed, reset]}
        run_id: {$ref: '#/components/schemas/Id'}
        cursor: {type: string}
        execution_epoch: {type: integer, minimum: 0}
        status: {$ref: '#/components/schemas/RunStatus'}
        events: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Event'}}
        session_no: {type: [integer, 'null'], minimum: 1}
        metrics_ready: {type: boolean}
        resync_required: {type: boolean}
        failure_code: {type: [string, 'null']}
        progress: {$ref: '#/components/schemas/Progress'}
        calculation_version: {type: string}
        metrics_watermark: {type: integer, minimum: 0}
        latest_completed_session_no: {type: [integer, 'null'], minimum: 1}
        report_ready: {type: boolean}
      allOf:
        - if: {properties: {type: {enum: [run_started, progress_batch]}}, required: [type]}
          then: {required: [progress]}
        - if: {properties: {type: {const: session_completed}}, required: [type]}
          then: {required: [calculation_version, metrics_watermark], properties: {metrics_ready: {const: true}, session_no: {type: integer}}}
        - if: {properties: {type: {const: run_completed}}, required: [type]}
          then: {required: [report_ready, latest_completed_session_no], properties: {status: {const: completed}, report_ready: {const: true}}}
        - if: {properties: {type: {const: run_failed}}, required: [type]}
          then: {properties: {status: {const: failed}, failure_code: {type: string}}}
        - if: {properties: {type: {const: reset}}, required: [type]}
          then: {properties: {resync_required: {const: true}}}
    MetricDefinition:
      type: object
      additionalProperties: false
      required: [name, label_vi, description_vi, unit, kind, scopes, calculation_version]
      properties:
        name: {type: string}
        label_vi: {type: string}
        description_vi: {type: string}
        unit: {enum: [count, ratio]}
        kind: {enum: [counter, state, rate]}
        scopes: {type: array, items: {enum: [run, article, shop, product]}}
        calculation_version: {type: string}
    MetricPoint:
      type: object
      additionalProperties: false
      required: [session_no, scope_type, scope_id, metric_name, numerator, denominator, session_value, cumulative_numerator, cumulative_denominator, cumulative_value, calculation_version, projected_through_seq]
      properties:
        session_no: {type: integer, minimum: 1}
        scope_type: {enum: [run, article, shop, product]}
        scope_id: {$ref: '#/components/schemas/Id'}
        metric_name: {type: string}
        numerator: {type: number, minimum: 0}
        denominator: {type: [number, 'null'], minimum: 0}
        session_value: {type: [number, 'null'], minimum: 0}
        cumulative_numerator: {type: number, minimum: 0}
        cumulative_denominator: {type: [number, 'null'], minimum: 0}
        cumulative_value: {type: [number, 'null'], minimum: 0}
        calculation_version: {type: string}
        projected_through_seq: {type: integer, minimum: 0}
    Usage:
      type: object
      additionalProperties: false
      required: [attempts, usage_missing_attempts, input_tokens, output_tokens, total_tokens, by_session]
      properties:
        attempts: {type: integer, minimum: 0}
        usage_missing_attempts: {type: integer, minimum: 0}
        input_tokens: {type: [integer, 'null'], minimum: 0}
        output_tokens: {type: [integer, 'null'], minimum: 0}
        total_tokens: {type: [integer, 'null'], minimum: 0}
        by_session:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [session_no, attempts, usage_missing_attempts, input_tokens, output_tokens, total_tokens]
            properties:
              session_no: {type: integer, minimum: 1}
              attempts: {type: integer, minimum: 0}
              usage_missing_attempts: {type: integer, minimum: 0}
              input_tokens: {type: [integer, 'null'], minimum: 0}
              output_tokens: {type: [integer, 'null'], minimum: 0}
              total_tokens: {type: [integer, 'null'], minimum: 0}
    Report:
      type: object
      additionalProperties: false
      required: [run, partial, sessions, metrics, usage]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        partial: {type: boolean}
        sessions: {type: array, items: {$ref: '#/components/schemas/RunSession'}}
        metrics: {type: array, items: {$ref: '#/components/schemas/MetricPoint'}}
        usage: {$ref: '#/components/schemas/Usage'}
